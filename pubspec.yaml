name: avalon_companion
description: "Offline Game Master companion for physical games of The Resistance: Avalon."
publish_to: 'none'

version: 1.10.0+33

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  material_ui: ^1.11.0
  cupertino_ui: any
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  crypto: ^3.0.6
  # Reading a narrator voice pack handed to the app as a .zip. Pure Dart: the
  # archive is unpacked on the device, never uploaded.
  archive: ^3.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  sqlite3: ^3.9.1

# `path_provider_android` 2.3 depends on `package:jni`, which builds a native
# helper with CMake and therefore needs a complete Android NDK on the build
# machine. This app only asks for the documents directory, so it stays on the
# last platform-channel implementation. Remove this pin once the NDK toolchain
# is part of the build (see DEVELOPMENT_PLAN, Phase 12).
dependency_overrides:
  path_provider_android: '>=2.2.5 <2.3.0'

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Flutter asset folders are not recursive: each language folder is listed.
    - assets/audio/narration/Dahlia voices/en/
    - assets/audio/narration/Dahlia voices/fil/
    # Extra bundled voices, one folder per voice. Each `<voice>/en/` and
    # `<voice>/fil/` folder must be listed on its own line; see the README
    # inside this directory.
    - assets/audio/voices/okley/en/
    - assets/audio/voices/okley/fil/
    - assets/audio/voices/Grok/en/
    - assets/audio/voices/Grok/fil/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

