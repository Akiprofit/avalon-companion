org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Pin the Gradle JVM to the JDK bundled with Android Studio. Without this,
# Gradle's toolchain scan finds a JRE from an editor extension that has no
# jlink, and the androidJdkImage transform fails.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr,C:/Program Files/Java/jdk-21
# Never let a build download SDK packages on its own. Gradle once decided to
# install the NDK mid-build, spent 19 minutes on it and then failed, taking the
# build with it. The SDK on this machine is maintained by hand.
android.builder.sdkDownload=false